<div class="login-page">
  <div class="card login-card">
    <div class="login-brand">
      <span class="login-mark"><app-icon name="folder" [size]="26" /></span>
      <h1>Gestion Documental</h1>
      <p class="muted">Inicia sesion para ver tus archivos</p>
    </div>

    <form (ngSubmit)="submit()">
      <label class="field">
        <span>Correo</span>
        <input
          class="input"
          type="email"
          name="email"
          autocomplete="username"
          placeholder="correo@ejemplo.com"
          [ngModel]="email()"
          (ngModelChange)="email.set($event)"
        />
      </label>

      <label class="field">
        <span>Contrasena</span>
        <div class="password-wrap">
          <input
            class="input"
            name="password"
            autocomplete="current-password"
            [type]="showPassword() ? 'text' : 'password'"
            [ngModel]="password()"
            (ngModelChange)="password.set($event)"
          />
          <button
            class="toggle"
            type="button"
            [attr.aria-label]="showPassword() ? 'Ocultar contrasena' : 'Mostrar contrasena'"
            [attr.aria-pressed]="showPassword()"
            (click)="togglePassword()"
          >
            <app-icon [name]="showPassword() ? 'eye-off' : 'eye'" />
          </button>
        </div>
      </label>

      @if (error()) {
        <p class="alert-error" role="alert">{{ error() }}</p>
      }

      <button class="btn btn-primary login-submit" type="submit" [disabled]="loading()">
        {{ loading() ? 'Ingresando...' : 'Ingresar' }}
      </button>
    </form>
  </div>
</div>
